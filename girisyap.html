<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="giris.css">
    <title>Giriş Ekranı</title>
</head>

<body>
    <div class="wolf-background">
        <div class="wolf-3d">
            <div class="wolf-head">
               <img src="bozkurt.jpg" >
            </div>
        </div>
    </div>
    <form id="form" >
        <div class="field">
            <i class="fa-solid fa-user"></i>
            <label>Kullanıcı Adı:</label><br>
            <input id="kullaniciAdi" type="text" placeholder="(isimin_giriniz)">
            <p id="nameError" class="error"></p>
        </div>

        <div class="field">
            <i class="fa-solid fa-envelope"></i>
            <label>Email:</label><br>
            <input id="eposta" type="text" placeholder="(isim@ornek.com)">
            <p id="emailError" class="error"></p>
        </div>

        <div class="field">
            <i class="fa-solid fa-mobile"></i>
            <label>Numara:</label><br>
            <input id="numara" class="phone" type="number" placeholder="(5##)### ## ##">
            <p id="phoneError" class="error"></p>
        </div>
        <div class="field">
            <i class="fa-solid fa-key"></i>
            <label>şifre:</label><br>
            <input id="sifre" type="password" placeholder="********">
            <p id="passwordError" class="error"></p>
        </div>
        <p><button type="submit"><i class="fa-solid fa-right-to-bracket"></i> Giriş Yap</button></p>
    </form>


    <script src="giris.js"></script>
</body>

</html>
