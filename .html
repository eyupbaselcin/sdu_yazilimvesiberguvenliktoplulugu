<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Giriş Formu</title>
        <link rel="stylesheet" href="giris.css">
    </head>
    <body>
        <form id="loginForm" novalidate>
            <div class="satir">
                <label for="username">Göreviniz</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="satir">
                <label for="email">E-posta:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="satir">
                <label for="password">Şifre:</label>
                <input type="password" id="password" name="password" required>
                <label class="show-pass"><input type="checkbox" id="showPassword"> Şifreyi Göster</label>
            </div>
            <div class="butonlar">
                <button type="submit">Giriş Yap</button>
                <button type="reset">Sıfırla</button>
            </div>
        </form>

        <script>
            function togglePasswordVisibility() {
                const pwd = document.getElementById('password');
                const chk = document.getElementById('showPassword');
                if (!pwd || !chk) return;
                pwd.type = chk.checked ? 'text' : 'password';
            }

            const showChk = document.getElementById('showPassword');
            if (showChk) showChk.addEventListener('change', togglePasswordVisibility);
        </script>
    </body>
</html>
